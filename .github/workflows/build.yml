name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes da lógica do jogo
        run: |
          chmod +x gradlew
          ./gradlew core:test --stacktrace

      - name: Compilar APK assinado
        run: ./gradlew android:assembleRelease --stacktrace

      - name: Conferir APK
        run: |
          APK=$(ls android/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT dump badging "$APK" | grep -E "package|uses-permission|sdkVersion|application-label" || true
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: core/build/reports/tests/
