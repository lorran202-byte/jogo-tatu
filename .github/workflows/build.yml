name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew android:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Testes da lógica do jogo
        run: |
          ./gradlew core:test --console=plain --continue > test.log 2>&1 || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fail = 0
          for f in glob.glob('core/build/test-results/test/*.xml'):
              r = ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  tot += 1
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      fail += 1
                      print('::error::TESTE ' + tc.get('name') + ': ' + (fl.get('message') or '')[:300].replace('\n', ' '))
          print(f'::notice::Testes: {tot - fail} de {tot} passaram')
          PY
          grep -E "^e: " test.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Mostrar erros
        if: failure()
        run: |
          { grep -E "^e: |^ERROR|AAPT: error|error:" build.log; grep -A12 "What went wrong" build.log; } | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Conferir APK
        run: |
          APK=$(ls android/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT dump badging "$APK" | grep -E "^package|uses-permission|sdkVersion|application-label:" | while IFS= read -r l; do echo "::notice::$l"; done
          echo "::notice::tamanho $(du -h "$APK" | cut -f1)"

      - name: Publicar APK no branch builds
        run: |
          mkdir out
          APK=$(ls android/build/outputs/apk/release/*.apk | head -1)
          split -b 45m -d "$APK" out/jogo.apk.part
          sha256sum "$APK" | cut -d' ' -f1 > out/jogo.sha256
          cd out
          git init -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
